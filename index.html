<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noise Monitor</title>
<style>
  :root {
    --navy-dark: #0F1C33;
    --navy-mid: #16274A;
    --navy-light: #1E345C;
    --gold: #E3A857;
    --green: #4CAF6D;
    --red: #D64545;
    --text: #F2EEE4;
    --text-dim: #8FA0C2;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--navy-dark);
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    padding: 2vh 3vw 2.2vh;
    gap: 1.2vh;
  }

  /* ---- Top bar ---- */
  #topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
  }
  #topbar-left { display: flex; align-items: center; gap: 14px; }
  #topbar-right { display: flex; align-items: center; gap: 14px; }
  #periodLabel {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 1.25rem;
    color: var(--text);
    background: var(--navy-mid);
    border: 1px solid var(--navy-light);
    border-radius: 7px;
    padding: 7px 12px;
    width: 200px;
    cursor: text;
  }
  #periodLabel::placeholder { color: var(--text-dim); opacity: 0.8; }
  #periodLabel:focus { outline: none; border-color: var(--gold); background: var(--navy-light); }
  #statusPill {
    font-size: 0.85rem;
    padding: 6px 13px;
    border-radius: 999px;
    background: var(--navy-mid);
    color: var(--text-dim);
  }
  #statusPill.live { color: var(--green); }
  #statusPill.learning { color: var(--gold); }
  #statusPill.off { color: #C97878; }
  #statusPill.paused { color: #6C7EA3; }
  #eq.paused { opacity: 0.35; }
  #debugReadout {
    font-size: 0.7rem;
    color: #5A6B8C;
    font-variant-numeric: tabular-nums;
  }
  #menuBtn {
    font-size: 1.3rem;
    line-height: 1;
    padding: 7px 14px;
    border-radius: 8px;
    border: 1px solid var(--navy-light);
    background: var(--navy-mid);
    color: var(--text);
    cursor: pointer;
  }
  #menuBtn:hover { border-color: var(--gold); }

  /* ---- Warning banner ---- */
  #warningBanner {
    flex-shrink: 0;
    text-align: center;
    font-weight: 700;
    border-radius: 10px;
    width: 100%;
    opacity: 0;
    max-height: 0;
    padding: 0 16px;
    overflow: hidden;
    transition: opacity 0.25s ease, max-height 0.25s ease, padding 0.25s ease;
  }
  #warningBanner.show { opacity: 1; max-height: 90px; padding: 12px 16px; }
  #warningBanner.mild { background: rgba(227,168,87,0.16); color: var(--gold); border: 1px solid rgba(227,168,87,0.45); font-size: 1.1rem; }
  #warningBanner.severe { background: rgba(214,69,69,0.2); color: #FF9D9D; border: 1px solid rgba(214,69,69,0.55); font-size: 1.15rem; animation: bannerPulse 1s ease-in-out infinite; }
  #warningBanner.demeritWarn { background: rgba(227,168,87,0.26); color: #FFD9A0; border: 1px solid var(--gold); font-size: 1.3rem; }
  #warningBanner.demeritFinal { background: rgba(214,69,69,0.32); color: #FFFFFF; border: 2px solid var(--red); font-size: 1.6rem; animation: bannerPulse 1s ease-in-out infinite; }
  @keyframes bannerPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.015); } }

  /* ---- Main: hero column + leaderboard column ---- */
  #main {
    flex: 1;
    display: flex;
    gap: 2.2vw;
    min-height: 0;
  }
  #heroCol {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }
  #hero {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6vw;
    min-height: 0;
  }
  #streakBlock { text-align: center; }
  #streakTime {
    font-family: Georgia, 'Times New Roman', serif;
    font-weight: 700;
    font-size: 17vh;
    line-height: 1;
    color: var(--gold);
    font-variant-numeric: tabular-nums;
  }
  #streakLabel {
    font-size: 1.25rem;
    color: var(--text-dim);
    margin-top: 0.5vh;
  }
  #recordTag {
    display: none;
    font-size: 1rem;
    color: var(--gold);
    font-weight: 700;
    margin-top: 0.6vh;
  }
  #violationBlock {
    text-align: center;
    padding: 2.5vh 2vw;
    border-left: 1px solid var(--navy-mid);
  }
  #violationCount {
    font-family: Georgia, serif;
    font-weight: 700;
    font-size: 8.5vh;
    line-height: 1;
    color: var(--green);
    transition: color 0.25s ease, transform 0.15s ease;
  }
  #violationCount.maxed { animation: pulse 0.9s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  #violationCaption { font-size: 0.95rem; color: var(--text-dim); margin-top: 0.3vh; }

  #eqWrap { flex-shrink: 0; }
  #eq {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 5px;
    height: 13vh;
    background: var(--navy-mid);
    border-radius: 10px;
    padding: 10px 14px 0;
    overflow: hidden;
  }
  .eqBar {
    flex: 1;
    min-width: 4px;
    max-width: 22px;
    height: 4%;
    border-radius: 3px 3px 0 0;
    background: linear-gradient(180deg, var(--gold), #C97A3A);
    transition: height 0.05s linear, background 0.15s ease;
  }
  .eqBar.hot { background: linear-gradient(180deg, var(--red), #8C2F2F); }

  /* ---- Leaderboard column (always visible, no popup) ---- */
  #leaderboardCol {
    width: 360px;
    flex-shrink: 0;
    background: var(--navy-mid);
    border-radius: 14px;
    padding: 18px 18px 14px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }
  .lbHeader { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  #leaderboardCol h3 { margin: 0; font-family: Georgia, serif; color: var(--gold); font-size: 1.05rem; }
  #clearLog { font-size: 0.7rem; padding: 4px 9px; background: transparent; border: 1px solid var(--navy-light); }
  #leaderboardCol table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  #leaderboardCol td, #leaderboardCol th {
    padding: 5px 6px;
    text-align: left;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  #leaderboardCol th { color: var(--text-dim); font-weight: 400; font-size: 0.78rem; }
  #leaderboardCol td:first-child { width: 26px; }
  #logTable tr:first-child td, #allTimeTable tr:first-child td { color: var(--gold); font-weight: 700; }
  #leaderboardDivider { height: 1px; background: var(--navy-light); margin: 16px 0 12px; flex-shrink: 0; }

  /* ---- Bottom action bar ---- */
  #bottomBar {
    flex-shrink: 0;
    display: flex;
    gap: 16px;
    height: 11vh;
    min-height: 64px;
  }
  .bigBtn {
    flex: 1;
    font-family: Arial, Helvetica, sans-serif;
    font-size: clamp(1rem, 2.2vh, 1.5rem);
    font-weight: 700;
    border-radius: 14px;
    border: 1px solid var(--navy-mid);
    background: var(--navy-mid);
    color: var(--text);
    cursor: pointer;
  }
  .bigBtn:hover { border-color: var(--gold); }
  .bigBtn.primary {
    background: var(--gold);
    color: var(--navy-dark);
    border-color: var(--gold);
  }

  /* ---- Settings slide-out menu ---- */
  #menuOverlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.45);
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s ease;
    z-index: 40;
  }
  #menuOverlay.open { opacity: 1; pointer-events: auto; }
  #menuPanel {
    position: fixed; top: 0; right: 0; bottom: 0;
    width: 340px; max-width: 86vw;
    background: var(--navy-mid);
    box-shadow: -8px 0 28px rgba(0,0,0,0.45);
    transform: translateX(100%);
    transition: transform 0.25s ease;
    z-index: 41;
    padding: 20px 22px;
    overflow-y: auto;
  }
  #menuPanel.open { transform: translateX(0); }
  .menuHeader { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  .menuHeader h3 { margin: 0; font-family: Georgia, serif; color: var(--gold); font-size: 1.2rem; }
  #menuCloseBtn {
    background: none; border: none; color: var(--text-dim);
    font-size: 1.3rem; cursor: pointer; padding: 2px 8px;
  }
  .menuSection { margin-bottom: 22px; }
  .menuSection > label {
    display: block; color: var(--text-dim); font-size: 0.85rem; margin-bottom: 7px;
  }
  .menuSection select {
    width: 100%;
    background: var(--navy-light);
    color: var(--text);
    border: 1px solid var(--navy-light);
    border-radius: 7px;
    padding: 8px;
    font-size: 0.95rem;
  }
  .gainLabelRow { display: flex; justify-content: space-between; }
  .gainLabelRow span { color: var(--text); font-weight: 700; }
  .threshGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tgroup {
    display: flex; flex-direction: column; gap: 4px;
    font-size: 0.8rem; color: var(--text-dim);
  }
  .tgroup input {
    background: var(--navy-light);
    color: var(--text);
    border: 1px solid var(--navy-light);
    border-radius: 6px;
    padding: 7px;
    font-size: 0.95rem;
    width: 100%;
  }
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div id="topbar-left">
      <input id="periodLabel" value="" placeholder="✎ Period name (e.g. Period 3)" spellcheck="false">
      <div id="statusPill" class="off">Mic off</div>
    </div>
    <div id="topbar-right">
      <div id="debugReadout"></div>
      <button id="menuBtn" aria-label="Settings">☰</button>
    </div>
  </div>

  <div id="warningBanner"><span id="warningText"></span></div>

  <div id="main">
    <div id="heroCol">
      <div id="hero">
        <div id="streakBlock">
          <div id="streakTime">0:00</div>
          <div id="streakLabel">quiet streak</div>
          <div id="recordTag">🔥 New ALL-TIME record!</div>
        </div>
        <div id="violationBlock">
          <div id="violationCount">0</div>
          <div id="violationCaption">strikes</div>
        </div>
      </div>
      <div id="eqWrap"><div id="eq"></div></div>
    </div>

    <div id="leaderboardCol">
      <div class="lbHeader"><h3>🏆 Today's Leaderboard</h3><button id="clearLog">clear</button></div>
      <table id="logTable"><thead><tr><th></th><th>Period</th><th>Best</th><th>Strikes</th></tr></thead><tbody></tbody></table>
      <div id="leaderboardDivider"></div>
      <div class="lbHeader"><h3>⭐ All-Time Top 10</h3></div>
      <table id="allTimeTable"><thead><tr><th></th><th>Date</th><th>Period</th><th>Best</th></tr></thead><tbody id="allTimeTableBody"></tbody></table>
    </div>
  </div>

  <div id="bottomBar">
    <button id="micBtn" class="bigBtn primary">Start Listening</button>
    <button id="pauseBtn" class="bigBtn">Pause (P)</button>
    <button id="resetBtn" class="bigBtn">End Period</button>
  </div>
</div>

<div id="toast"></div>

<div id="menuOverlay"></div>
<div id="menuPanel">
  <div class="menuHeader"><h3>Settings</h3><button id="menuCloseBtn">✕</button></div>

  <div class="menuSection">
    <label>Sensitivity</label>
    <select id="sensSelect">
      <option value="auto" selected>Auto — adjusts itself</option>
      <option value="lenient">Lenient — allow chatting</option>
      <option value="balanced">Balanced (manual)</option>
      <option value="strict">Strict (manual)</option>
    </select>
  </div>

  <div class="menuSection">
    <div class="gainLabelRow"><label style="margin-bottom:0;">Mic gain</label><span id="gainValue">1.5x</span></div>
    <input type="range" id="gainSlider" min="0.5" max="3" step="0.1" value="1.5" style="width:100%;">
  </div>

  <div class="menuSection">
    <label>Strike thresholds</label>
    <div class="threshGrid">
      <div class="tgroup">Red at<input id="redMaxInput" type="number" min="2" max="100" value="20"></div>
      <div class="tgroup">Dark red at<input id="darkStartInput" type="number" min="2" max="150" value="30"></div>
      <div class="tgroup">Warn at<input id="warnAtInput" type="number" min="2" max="200" value="40"></div>
      <div class="tgroup">Demerit at<input id="demeritAtInput" type="number" min="2" max="300" value="50"></div>
    </div>
  </div>
</div>

<script>
(function () {
  const streakTimeEl = document.getElementById('streakTime');
  const violationCountEl = document.getElementById('violationCount');
  const eqEl = document.getElementById('eq');
  const micBtn = document.getElementById('micBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const sensSelect = document.getElementById('sensSelect');
  const gainSlider = document.getElementById('gainSlider');
  const gainValue = document.getElementById('gainValue');
  const statusPill = document.getElementById('statusPill');
  const periodLabel = document.getElementById('periodLabel');
  const redMaxInput = document.getElementById('redMaxInput');
  const darkStartInput = document.getElementById('darkStartInput');
  const warnAtInput = document.getElementById('warnAtInput');
  const demeritAtInput = document.getElementById('demeritAtInput');
  const resetBtn = document.getElementById('resetBtn');
  const debugReadout = document.getElementById('debugReadout');
  const logTableBody = document.querySelector('#logTable tbody');
  const clearLogBtn = document.getElementById('clearLog');
  const warningBanner = document.getElementById('warningBanner');
  const warningText = document.getElementById('warningText');
  const toastEl = document.getElementById('toast');
  const recordTagEl = document.getElementById('recordTag');
  const allTimeTableBody = document.getElementById('allTimeTableBody');
  const menuBtn = document.getElementById('menuBtn');
  const menuPanel = document.getElementById('menuPanel');
  const menuOverlay = document.getElementById('menuOverlay');
  const menuCloseBtn = document.getElementById('menuCloseBtn');

  const NUM_BARS = 26;
  const bars = [];
  for (let i = 0; i < NUM_BARS; i++) {
    const d = document.createElement('div');
    d.className = 'eqBar';
    eqEl.appendChild(d);
    bars.push(d);
  }

  let audioCtx, analyser, timeData, freqData, source, stream;
  let rafId = null, tickerId = null;

  // ---- Sound detection settings (unchanged from prior tuning pass) ----
  const WINDOW_MS = 45000;      // rolling window for the noise floor
  const BOOTSTRAP_MS = 8000;    // learning period before counting starts
  const SAMPLE_INTERVAL_MS = 150;

  const SENSITIVITY = {
    lenient:  { marginBase: 15, marginMult: 0.25, sustainMs: 2000, cooldownMs: 4000, minThreshold: 25, maxThreshold: 70 },
    balanced: { marginBase: 10, marginMult: 0.15, sustainMs: 1200, cooldownMs: 3500, minThreshold: 20, maxThreshold: 58 },
    strict:   { marginBase: 6,  marginMult: 0.08, sustainMs: 700,  cooldownMs: 3000, minThreshold: 15, maxThreshold: 48 }
  };
  let sensitivity = localStorage.getItem('noiseSensitivity') || 'auto';
  sensSelect.value = sensitivity;

  let micGain = parseFloat(localStorage.getItem('noiseMicGain')) || 1.5;
  gainSlider.value = micGain;
  gainValue.textContent = micGain.toFixed(1) + 'x';

  let autoLevel = 1.0;
  let violationTimes = [];

  function interpAt(level) {
    const L = SENSITIVITY.lenient, B = SENSITIVITY.balanced, S = SENSITIVITY.strict;
    function seg(key) {
      if (level <= 1) {
        const t = level;
        return L[key] + (B[key] - L[key]) * t;
      } else {
        const t = level - 1;
        return B[key] + (S[key] - B[key]) * t;
      }
    }
    const minThreshold = Math.max(8, seg('minThreshold'));
    return {
      marginBase: Math.max(2, seg('marginBase')),
      marginMult: Math.max(0.02, seg('marginMult')),
      sustainMs: Math.max(300, seg('sustainMs')),
      cooldownMs: Math.max(1200, seg('cooldownMs')),
      minThreshold: minThreshold,
      maxThreshold: Math.max(minThreshold + 8, seg('maxThreshold'))
    };
  }

  function currentCfg() {
    return sensitivity === 'auto' ? interpAt(autoLevel) : SENSITIVITY[sensitivity];
  }

  function autoTierLabel(level) {
    if (level < 1.15) return 'Balanced';
    if (level < 1.7) return 'Firm';
    if (level < 2.4) return 'Strict';
    return 'Max';
  }

  function adaptAutoLevel(now) {
    if (sensitivity !== 'auto') return;
    if (isPaused || now - sessionStart < BOOTSTRAP_MS) return;
    violationTimes = violationTimes.filter(t => now - t <= 60000);
    const recentCount = violationTimes.length;
    const quietMs = now - streakStartTime;
    if (recentCount >= 2) {
      autoLevel = Math.min(3.0, autoLevel + 0.15);
    } else if (recentCount === 0 && quietMs > 30000) {
      autoLevel = Math.max(1.0, autoLevel - 0.1);
    }
  }

  // ---- Strike display thresholds (separate from audio detection above) ----
  let redMax = parseInt(localStorage.getItem('noiseRedMax'), 10) || 20;
  let darkStart = parseInt(localStorage.getItem('noiseDarkStart'), 10) || 30;
  let warnAt = parseInt(localStorage.getItem('noiseWarnAt'), 10) || 40;
  let demeritAt = parseInt(localStorage.getItem('noiseDemeritAt'), 10) || 50;
  redMaxInput.value = redMax;
  darkStartInput.value = darkStart;
  warnAtInput.value = warnAt;
  demeritAtInput.value = demeritAt;

  function violationColor(count) {
    const t = Math.min(1, count / redMax);
    let hue, lightness = 52;
    if (t <= 0.5) {
      hue = 135 - (135 - 55) * (t / 0.5);
    } else {
      hue = 55 - 55 * ((t - 0.5) / 0.5);
    }
    if (count >= redMax) hue = 0;
    if (count > darkStart) {
      const span = Math.max(1, demeritAt - darkStart);
      const darkT = Math.min(1, (count - darkStart) / span);
      lightness = 52 - (52 - 26) * darkT;
      hue = 0;
    }
    return `hsl(${hue}, 72%, ${lightness}%)`;
  }

  let dailyRecordMs = 0;
  function computeDailyRecordMs() {
    const key = 'noiseLog_' + new Date().toISOString().slice(0, 10);
    const existing = JSON.parse(localStorage.getItem(key) || '[]');
    dailyRecordMs = existing.reduce((m, r) => Math.max(m, r.bestMs || 0), 0);
  }

  const ALL_TIME_KEY = 'noiseAllTime';
  const MAX_ALLTIME_ENTRIES = 1000;
  let allTimeRecordMs = 0;
  function computeAllTimeRecordMs() {
    const existing = JSON.parse(localStorage.getItem(ALL_TIME_KEY) || '[]');
    allTimeRecordMs = existing.reduce((m, r) => Math.max(m, r.bestMs || 0), 0);
  }
  function renderAllTimeLeaderboard() {
    const existing = JSON.parse(localStorage.getItem(ALL_TIME_KEY) || '[]');
    const top = existing.slice().sort((a, b) => (b.bestMs || 0) - (a.bestMs || 0)).slice(0, 10);
    allTimeTableBody.innerHTML = '';
    top.forEach((row, i) => {
      const rank = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i + 1) + '.';
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${rank}</td><td>${row.date || ''}</td><td>${row.period}</td><td>${row.best}</td>`;
      allTimeTableBody.appendChild(tr);
    });
  }

  let toastTimer = null;
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2200);
  }

  function clearWarningBanner() {
    warningBanner.className = '';
    warningText.textContent = '';
  }

  function updateWarningBanner(now) {
    const win45 = violationTimes.filter(t => now - t <= 45000).length;
    const win60 = violationTimes.filter(t => now - t <= 60000).length;
    let cls = null, text = null;
    if (violationCount >= demeritAt) {
      cls = 'demeritFinal'; text = 'Class demerit for noise';
    } else if (violationCount >= warnAt) {
      cls = 'demeritWarn'; text = '⚠ Warning: close to a class demerit for noise';
    } else if (win60 >= 4) {
      cls = 'severe'; text = 'Being quiet will stop the strikes';
    } else if (win45 >= 2) {
      cls = 'mild'; text = 'Lower your volume';
    }
    if (cls) {
      warningBanner.className = 'show ' + cls;
      warningText.textContent = text;
    } else {
      clearWarningBanner();
    }
  }

  let levelBuffer = [];
  let sessionStart = 0;
  let threshold = 50;
  let smoothedLevel = 0;
  let violationCount = 0;
  let lastViolationTime = 0;
  let streakStartTime = 0;
  let bestStreakMs = 0;
  let isListening = false;
  let isPaused = false;
  let lastSampleTime = 0;
  let aboveSince = null;

  function volumeScale(rms) {
    return Math.min(100, Math.round(rms * 100 * 3.2));
  }

  function fmtTime(ms) {
    const totalSec = Math.floor(ms / 1000);
    const m = Math.floor(totalSec / 60);
    const s = totalSec % 60;
    return m + ':' + String(s).padStart(2, '0');
  }

  function recomputeThreshold() {
    const now = Date.now();
    levelBuffer = levelBuffer.filter(p => now - p.t <= WINDOW_MS);
    if (levelBuffer.length < 20) return;
    const cfg = currentCfg();
    const levels = levelBuffer.map(p => p.level).sort((a, b) => a - b);
    const floorIdx = Math.floor(levels.length * 0.18);
    const floor = levels[floorIdx];
    const margin = Math.max(cfg.marginBase, floor * cfg.marginMult);
    threshold = Math.min(cfg.maxThreshold, Math.max(cfg.minThreshold, Math.round(floor + margin)));
  }

  function updateViolationDisplay() {
    violationCountEl.textContent = violationCount;
    violationCountEl.style.color = violationColor(violationCount);
    violationCountEl.classList.toggle('maxed', violationCount >= redMax);
  }

  function evaluateLevel(level, now) {
    const cfg = currentCfg();
    if (level >= threshold) {
      if (aboveSince === null) aboveSince = now;
    } else {
      aboveSince = null;
      return;
    }
    if (isPaused) return;
    if (now - sessionStart < BOOTSTRAP_MS) return;
    if (now - lastViolationTime < cfg.cooldownMs) return;
    if (now - aboveSince < cfg.sustainMs) return;

    lastViolationTime = now;
    aboveSince = now;
    violationCount++;
    violationTimes.push(now);
    updateViolationDisplay();
    streakStartTime = now;
  }

  function updateStreakDisplay() {
    const now = Date.now();
    const elapsed = now - streakStartTime;
    if (elapsed > bestStreakMs) bestStreakMs = elapsed;
    streakTimeEl.textContent = fmtTime(elapsed);
    recordTagEl.style.display = (allTimeRecordMs > 0 && elapsed > allTimeRecordMs) ? 'block' : 'none';
    adaptAutoLevel(now);
  }

  function renderEQ() {
    analyser.getByteFrequencyData(freqData);
    const usableBins = Math.floor(freqData.length * 0.55);
    const perBar = Math.max(1, Math.floor(usableBins / NUM_BARS));
    const hot = smoothedLevel >= threshold;
    for (let i = 0; i < NUM_BARS; i++) {
      let sum = 0;
      const start = i * perBar;
      for (let j = 0; j < perBar; j++) sum += freqData[start + j] || 0;
      const avg = sum / perBar;
      const pct = Math.min(100, Math.max(4, (avg / 255) * 130));
      bars[i].style.height = pct + '%';
      bars[i].classList.toggle('hot', hot);
    }
  }

  function tick() {
    analyser.getByteTimeDomainData(timeData);
    let sumSquares = 0;
    for (let i = 0; i < timeData.length; i++) {
      const v = (timeData[i] - 128) / 128;
      sumSquares += v * v;
    }
    const rms = Math.sqrt(sumSquares / timeData.length);
    const level = volumeScale(rms * micGain);
    smoothedLevel = smoothedLevel * 0.7 + level * 0.3;

    const now = Date.now();
    if (now - lastSampleTime >= SAMPLE_INTERVAL_MS) {
      lastSampleTime = now;
      levelBuffer.push({ t: now, level: smoothedLevel });
      recomputeThreshold();
    }

    if (isPaused) {
      statusPill.textContent = 'Paused — not counting';
      statusPill.className = 'paused';
    } else if (now - sessionStart < BOOTSTRAP_MS) {
      statusPill.textContent = 'Learning the room…';
      statusPill.className = 'learning';
    } else {
      statusPill.textContent = 'Listening';
      statusPill.className = 'live';
    }

    const tierText = sensitivity === 'auto' ? (' · ' + autoTierLabel(autoLevel)) : '';
    debugReadout.textContent = 'level ' + Math.round(smoothedLevel) + ' · line ' + threshold + tierText;

    evaluateLevel(smoothedLevel, now);
    updateWarningBanner(now);

    renderEQ();
    eqEl.classList.toggle('paused', isPaused);
    rafId = requestAnimationFrame(tick);
  }

  async function startMic() {
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (err) {
      statusPill.textContent = 'Mic access denied';
      statusPill.className = 'off';
      alert('This needs microphone access to work. Allow it in your browser, then click "Start Listening" again.');
      return;
    }
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    timeData = new Uint8Array(analyser.fftSize);
    freqData = new Uint8Array(analyser.frequencyBinCount);
    source = audioCtx.createMediaStreamSource(stream);
    source.connect(analyser);

    sessionStart = Date.now();
    streakStartTime = sessionStart;
    lastSampleTime = 0;
    levelBuffer = [];
    aboveSince = null;
    autoLevel = 1.0;
    violationTimes = [];
    isListening = true;
    isPaused = false;
    pauseBtn.textContent = 'Pause (P)';
    clearWarningBanner();
    computeDailyRecordMs();
    computeAllTimeRecordMs();

    micBtn.textContent = 'Stop Listening';
    tick();
    tickerId = setInterval(updateStreakDisplay, 500);
  }

  function stopMic() {
    isListening = false;
    if (rafId) cancelAnimationFrame(rafId);
    if (tickerId) clearInterval(tickerId);
    if (stream) stream.getTracks().forEach(t => t.stop());
    if (audioCtx) audioCtx.close();
    statusPill.textContent = 'Mic off';
    statusPill.className = 'off';
    micBtn.textContent = 'Start Listening';
    debugReadout.textContent = '';
    bars.forEach(b => { b.style.height = '4%'; b.classList.remove('hot'); });
  }

  micBtn.addEventListener('click', () => {
    if (isListening) stopMic(); else startMic();
  });

  function togglePause() {
    if (!isListening) return;
    isPaused = !isPaused;
    aboveSince = null;
    pauseBtn.textContent = isPaused ? 'Resume (P)' : 'Pause (P)';
    pauseBtn.classList.toggle('primary', isPaused);
  }
  pauseBtn.addEventListener('click', togglePause);
  window.addEventListener('keydown', (e) => {
    if (e.key.toLowerCase() === 'p' && document.activeElement.tagName !== 'INPUT') {
      togglePause();
    }
  });

  sensSelect.addEventListener('change', () => {
    sensitivity = sensSelect.value;
    localStorage.setItem('noiseSensitivity', sensitivity);
  });

  gainSlider.addEventListener('input', () => {
    micGain = parseFloat(gainSlider.value);
    gainValue.textContent = micGain.toFixed(1) + 'x';
    localStorage.setItem('noiseMicGain', micGain);
  });

  redMaxInput.addEventListener('input', () => {
    redMax = Math.max(2, parseInt(redMaxInput.value, 10) || 20);
    localStorage.setItem('noiseRedMax', redMax);
    updateViolationDisplay();
  });
  darkStartInput.addEventListener('input', () => {
    darkStart = Math.max(2, parseInt(darkStartInput.value, 10) || 30);
    localStorage.setItem('noiseDarkStart', darkStart);
    updateViolationDisplay();
  });
  warnAtInput.addEventListener('input', () => {
    warnAt = Math.max(2, parseInt(warnAtInput.value, 10) || 40);
    localStorage.setItem('noiseWarnAt', warnAt);
  });
  demeritAtInput.addEventListener('input', () => {
    demeritAt = Math.max(2, parseInt(demeritAtInput.value, 10) || 50);
    localStorage.setItem('noiseDemeritAt', demeritAt);
  });

  periodLabel.addEventListener('focus', () => periodLabel.select());

  function openMenu() { menuPanel.classList.add('open'); menuOverlay.classList.add('open'); }
  function closeMenu() { menuPanel.classList.remove('open'); menuOverlay.classList.remove('open'); }
  menuBtn.addEventListener('click', openMenu);
  menuCloseBtn.addEventListener('click', closeMenu);
  menuOverlay.addEventListener('click', closeMenu);

  function logPeriod(label) {
    const today = new Date().toISOString().slice(0, 10);
    const key = 'noiseLog_' + today;
    const existing = JSON.parse(localStorage.getItem(key) || '[]');
    const entry = {
      period: label,
      count: violationCount,
      bestMs: bestStreakMs,
      best: fmtTime(bestStreakMs)
    };
    existing.push(entry);
    localStorage.setItem(key, JSON.stringify(existing));
    renderLog();
    computeDailyRecordMs();

    let allTime = JSON.parse(localStorage.getItem(ALL_TIME_KEY) || '[]');
    allTime.push({ ...entry, date: today });
    if (allTime.length > MAX_ALLTIME_ENTRIES) {
      allTime = allTime.slice(allTime.length - MAX_ALLTIME_ENTRIES);
    }
    localStorage.setItem(ALL_TIME_KEY, JSON.stringify(allTime));
    renderAllTimeLeaderboard();
    computeAllTimeRecordMs();
  }

  function renderLog() {
    const key = 'noiseLog_' + new Date().toISOString().slice(0, 10);
    const existing = JSON.parse(localStorage.getItem(key) || '[]');
    const sorted = existing.slice().sort((a, b) => (b.bestMs || 0) - (a.bestMs || 0));
    logTableBody.innerHTML = '';
    sorted.forEach((row, i) => {
      const rank = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i + 1) + '.';
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${rank}</td><td>${row.period}</td><td>${row.best}</td><td>${row.count}</td>`;
      logTableBody.appendChild(tr);
    });
  }

  let endingPeriod = false;
  resetBtn.addEventListener('click', () => {
    if (endingPeriod) return;
    endingPeriod = true;
    setTimeout(() => { endingPeriod = false; }, 800);

    if (!isListening) {
      showToast('Start listening before ending a period.');
      return;
    }
    const label = (periodLabel.value || '').trim() || 'Unnamed period';
    logPeriod(label);
    violationCount = 0;
    bestStreakMs = 0;
    levelBuffer = [];
    aboveSince = null;
    autoLevel = 1.0;
    violationTimes = [];
    isPaused = false;
    pauseBtn.textContent = 'Pause (P)';
    pauseBtn.classList.remove('primary');
    sessionStart = Date.now();
    streakStartTime = sessionStart;
    updateViolationDisplay();
    clearWarningBanner();
    recordTagEl.style.display = 'none';
    showToast('Period logged ✓ — ' + label);
  });

  clearLogBtn.addEventListener('click', () => {
    const key = 'noiseLog_' + new Date().toISOString().slice(0, 10);
    localStorage.removeItem(key);
    renderLog();
  });

  // init
  updateViolationDisplay();
  computeDailyRecordMs();
  renderLog();
  computeAllTimeRecordMs();
  renderAllTimeLeaderboard();

  window.addEventListener('beforeunload', () => {
    if (rafId) cancelAnimationFrame(rafId);
    if (tickerId) clearInterval(tickerId);
  });
})();
</script>
</body>
</html>
